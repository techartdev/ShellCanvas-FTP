[package]
name = "shellcanvas-ftp-adapter"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[[bin]]
name = "shellcanvas-ftp"
path = "src/main.rs"

[dependencies]
shellcanvas-adapter-sdk = { path = "vendor/shellcanvas-adapter-sdk" }
suppaftp = { version = "12.0.1", features = ["native-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
tempfile = "3"

[workspace]
